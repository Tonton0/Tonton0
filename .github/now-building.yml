# Source de vérité pour la section "En cours" du README.
# Édite ce fichier puis push : le workflow régénère la section
# entre <!-- BUILDING:START --> et <!-- BUILDING:END -->.
#
# Statuts : 🟢 production · 🟡 beta · 🔵 actif · 🟣 R&D · ⚪ pause
# Rendu   : [ RUN ]        [BETA ]   [WORK ]   [ R&D ]  [PAUSE]
#
# Champs :
#   status — statut affiché. Sert aussi de valeur de repli si l'API GitHub
#            est injoignable (secret absent, token expiré, repo supprimé).
#   repo   — owner/name. Si renseigné, le statut est recalculé depuis la date
#            du dernier push : < 14 j → 🔵 · < 90 j → 🟢 · au-delà → ⚪.
#   pin    — true = ne jamais recalculer. Pour les états que la date ne peut
#            pas deviner (R&D, conception, beta) ou les projets sans repo.

items:
