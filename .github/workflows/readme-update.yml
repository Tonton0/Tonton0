name: Update README — Now Building

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - .github/now-building.yml
      - .github/workflows/readme-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build "Now Building" section
        id: build
        env:
          # PAT (scopes repo + read:org) : les projets sont privés et SwyftSite
          # vit dans une autre org, le GITHUB_TOKEN par défaut ne les voit pas.
          # Absent ou expiré => repli sur les statuts écrits dans le YAML.
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, re, sys, urllib.error, urllib.request
          from datetime import datetime, timezone

          try:
              import yaml
          except ImportError:
              os.system("pip install --quiet pyyaml")
              import yaml

          # Statut YAML -> tag terminal aligné (le README est en style shell).
          TAGS = {
              "🟢": "[ RUN ]",
              "🟡": "[BETA ]",
              "🔵": "[WORK ]",
              "🟣": "[ R&D ]",
              "⚪": "[PAUSE]",
          }

          # Une date de push ne dit qu'une chose : est-ce un chantier en cours.
          # Elle ne dit pas si le produit tourne — un service en production
          # stable peut rester des mois sans commit. L'auto ne fait donc que
          # promouvoir en 🔵 ; tout le reste vient du statut déclaré.
          ACTIVE_DAYS = 14

          src = pathlib.Path(".github/now-building.yml")
          if not src.exists():
              print("now-building.yml absent, abort")
              sys.exit(0)

          data = yaml.safe_load(src.read_text(encoding="utf-8")) or {}
          items = data.get("items", [])

          token = os.environ.get("PROFILE_READ_TOKEN", "").strip()
          if not token:
              print("::warning::PROFILE_READ_TOKEN absent — statuts repris du YAML")

          def pushed_days_ago(repo):
              """Jours depuis le dernier push, ou None si l'info est inaccessible."""
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "Tonton0-readme-bot",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      pushed = json.load(resp).get("pushed_at")
              except urllib.error.HTTPError as err:
                  print(f"::warning::{repo} — HTTP {err.code}, statut repris du YAML")
                  return None
              except Exception as err:  # réseau, timeout, JSON illisible
                  print(f"::warning::{repo} — {type(err).__name__}, statut repris du YAML")
                  return None

              if not pushed:
                  return None
              when = datetime.strptime(pushed, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              return (datetime.now(timezone.utc) - when).days

          def resolve(it):
              """Statut effectif : épinglé, déduit du dernier push, ou repli YAML."""
              fallback = it.get("status", "🟢")
              repo = it.get("repo")
              if it.get("pin") or not repo or not token:
                  return fallback

              days = pushed_days_ago(repo)
              if days is None:
                  return fallback
              status = "🔵" if days <= ACTIVE_DAYS else fallback
              print(f"{repo}: dernier push il y a {days} j -> {status}")
              return status

          width = max((len(it.get("name", "")) for it in items), default=0) + 2

          lines = []
          for it in items:
              tag = TAGS.get(resolve(it), "[ RUN ]")
              name = it.get("name", "")
              desc = it.get("desc", "")
              lines.append(f"{tag} {name.ljust(width)}{desc}")

          # Pas d'horodatage : il changerait à chaque run et produirait
          # un commit toutes les N heures sans modification réelle.
          block = "```log\n" + "\n".join(lines) + "\n```\n\n<sub>Section régénérée automatiquement depuis .github/now-building.yml</sub>"

          readme = pathlib.Path("README.md")
          content = readme.read_text(encoding="utf-8")
          new = re.sub(
              r"<!-- BUILDING:START -->[\s\S]*?<!-- BUILDING:END -->",
              lambda _: f"<!-- BUILDING:START -->\n{block}\n<!-- BUILDING:END -->",
              content,
              count=1,
          )
          if new != content:
              readme.write_text(new, encoding="utf-8")
              print("README updated")
          else:
              print("No change")
          EOF

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(readme): refresh now building section"
            git push
          else
            echo "no changes"
          fi
