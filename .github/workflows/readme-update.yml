name: Update README — Now Building

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/now-building.yml
      - .github/workflows/readme-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build "Now Building" section
        id: build
        run: |
          python3 - <<'EOF'
          import os, re, datetime, pathlib, sys

          try:
              import yaml
          except ImportError:
              os.system("pip install --quiet pyyaml")
              import yaml

          src = pathlib.Path(".github/now-building.yml")
          if not src.exists():
              print("now-building.yml absent, abort")
              sys.exit(0)

          data = yaml.safe_load(src.read_text(encoding="utf-8")) or {}
          items = data.get("items", [])

          lines = []
          for it in items:
              status = it.get("status", "🟢")
              name = it.get("name", "")
              desc = it.get("desc", "")
              lines.append(f"- {status} **{name}** — {desc}")

          ts = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          block = "\n".join(lines) + f"\n\n<sub>📅 Auto-régénéré le {ts}</sub>"

          readme = pathlib.Path("README.md")
          content = readme.read_text(encoding="utf-8")
          new = re.sub(
              r"<!-- BUILDING:START -->[\s\S]*?<!-- BUILDING:END -->",
              f"<!-- BUILDING:START -->\n{block}\n<!-- BUILDING:END -->",
              content,
              count=1,
          )
          if new != content:
              readme.write_text(new, encoding="utf-8")
              print("README updated")
          else:
              print("No change")
          EOF

      - name: Commit & push if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore(readme): refresh now building section"
            git push
          else
            echo "no changes"
          fi
