<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200">
  <defs>
    <style>
      @keyframes fall {
        0% { opacity: 0; transform: translateY(-20px); }
        10% { opacity: 0.3; }
        90% { opacity: 0.3; }
        100% { opacity: 0; transform: translateY(200px); }
      }
      .code-char {
        font-family: 'Courier New', monospace;
        font-size: 12px;
        fill: #58A6FF;
        opacity: 0;
      }
      .col1 { animation: fall 4s linear infinite; }
      .col2 { animation: fall 5s linear infinite 0.5s; }
      .col3 { animation: fall 3.5s linear infinite 1s; }
      .col4 { animation: fall 4.5s linear infinite 1.5s; }
      .col5 { animation: fall 3s linear infinite 0.3s; }
      .col6 { animation: fall 5.5s linear infinite 2s; }
      .col7 { animation: fall 4s linear infinite 0.8s; }
      .col8 { animation: fall 3.8s linear infinite 1.2s; }
      .col9 { animation: fall 4.2s linear infinite 0.6s; }
      .col10 { animation: fall 5s linear infinite 1.8s; }
      .col11 { animation: fall 3.5s linear infinite 2.2s; }
      .col12 { animation: fall 4.8s linear infinite 0.4s; }
      .col13 { animation: fall 3.2s linear infinite 1.6s; }
      .col14 { animation: fall 4.6s linear infinite 2.5s; }
      .col15 { animation: fall 3.7s linear infinite 0.9s; }
      .col16 { animation: fall 5.2s linear infinite 1.3s; }
      .col17 { animation: fall 4.1s linear infinite 2.1s; }
      .col18 { animation: fall 3.4s linear infinite 0.7s; }
      .col19 { animation: fall 4.9s linear infinite 1.9s; }
      .col20 { animation: fall 3.6s linear infinite 2.4s; }
    </style>
  </defs>

  <rect width="850" height="200" fill="#0D1117" rx="10"/>

  <!-- Matrix rain columns -->
  <text x="30" y="10" class="code-char col1">0 1 0</text>
  <text x="30" y="30" class="code-char col1">1 0 1</text>
  <text x="30" y="50" class="code-char col1">{ }</text>
  <text x="30" y="70" class="code-char col1">= ></text>

  <text x="80" y="20" class="code-char col2">f( )</text>
  <text x="80" y="40" class="code-char col2">0x0</text>
  <text x="80" y="60" class="code-char col2">&&</text>

  <text x="130" y="5" class="code-char col3">[ ]</text>
  <text x="130" y="25" class="code-char col3">...</text>
  <text x="130" y="45" class="code-char col3">++</text>
  <text x="130" y="65" class="code-char col3">|></text>

  <text x="180" y="15" class="code-char col4">def</text>
  <text x="180" y="35" class="code-char col4">0b1</text>
  <text x="180" y="55" class="code-char col4">//</text>

  <text x="230" y="8" class="code-char col5">::</text>
  <text x="230" y="28" class="code-char col5">**</text>
  <text x="230" y="48" class="code-char col5">!=</text>

  <text x="620" y="12" class="code-char col6">( )</text>
  <text x="620" y="32" class="code-char col6">nil</text>
  <text x="620" y="52" class="code-char col6">0x1</text>

  <text x="670" y="18" class="code-char col7">=> </text>
  <text x="670" y="38" class="code-char col7">{ }</text>
  <text x="670" y="58" class="code-char col7">...</text>

  <text x="720" y="6" class="code-char col8">int</text>
  <text x="720" y="26" class="code-char col8">+=</text>
  <text x="720" y="46" class="code-char col8">%%</text>
  <text x="720" y="66" class="code-char col8">fn</text>

  <text x="770" y="22" class="code-char col9">&lt;/></text>
  <text x="770" y="42" class="code-char col9">==</text>
  <text x="770" y="62" class="code-char col9">!!</text>

  <text x="810" y="10" class="code-char col10">$ _</text>
  <text x="810" y="30" class="code-char col10">?:</text>
  <text x="810" y="50" class="code-char col10">|=</text>

  <text x="50" y="130" class="code-char col11">~></text>
  <text x="50" y="150" class="code-char col11">@</text>
  <text x="50" y="170" class="code-char col11">#!</text>

  <text x="100" y="120" class="code-char col12">py</text>
  <text x="100" y="140" class="code-char col12">ts</text>
  <text x="100" y="160" class="code-char col12">js</text>

  <text x="160" y="135" class="code-char col13">AI</text>
  <text x="160" y="155" class="code-char col13">ML</text>
  <text x="160" y="175" class="code-char col13">IA</text>

  <text x="690" y="125" class="code-char col14">>>></text>
  <text x="690" y="145" class="code-char col14"><<<</text>
  <text x="690" y="165" class="code-char col14">^^^</text>

  <text x="740" y="130" class="code-char col15">0</text>
  <text x="740" y="150" class="code-char col15">1</text>
  <text x="740" y="170" class="code-char col15">0</text>

  <text x="790" y="120" class="code-char col16">::</text>
  <text x="790" y="140" class="code-char col16">..</text>
  <text x="790" y="160" class="code-char col16">;;</text>

  <!-- Center area kept clean for readability -->
  <text x="425" y="90" text-anchor="middle" font-family="Fira Code, Courier New, monospace" font-size="28" font-weight="700" fill="#C9D1D9">vonboss</text>
  <text x="425" y="120" text-anchor="middle" font-family="Fira Code, Courier New, monospace" font-size="14" fill="#58A6FF">Développeur Full-Stack | VB Création</text>
  <line x1="325" y1="130" x2="525" y2="130" stroke="#58A6FF" stroke-width="1" opacity="0.3"/>
  <text x="425" y="150" text-anchor="middle" font-family="Fira Code, Courier New, monospace" font-size="11" fill="#8B949E">Python · TypeScript · React · IA · Blockchain</text>
</svg>
